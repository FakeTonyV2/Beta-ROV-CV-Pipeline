name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu 24.04 system and Python dependencies
        env:
          ALLOW_NON_REFERENCE_PLATFORM: "1"
        run: |
          bash scripts/setup_system_deps.sh
          bash scripts/setup_venv.sh
      - name: Verify imports and dependencies
        run: |
          .venv/bin/python scripts/smoke_imports.py
          .venv/bin/python scripts/verify_dependencies.py
      - name: Verify protobuf generation is reproducible
        run: |
          PATH="$PWD/.venv/bin:$PATH" bash scripts/generate_proto.sh
          git diff --exit-code -- generated/python
      - name: Check runtime and messaging types
        run: .venv/bin/python -m mypy
      - name: Lint and check formatting
        run: |
          .venv/bin/python -m ruff check src tests scripts/check_coverage.py scripts/summarize_transport_reports.py
          .venv/bin/python -m ruff format --check src tests scripts/check_coverage.py scripts/summarize_transport_reports.py
      - name: Run merge-blocking tests
      run: |
      .venv/bin/python -m pytest \
      -m "not extended and not requires_net_admin" \
      --cov=purdue_rov_cv \
      --cov-report=term-missing
      .venv/bin/python -m coverage json -o coverage.json
      .venv/bin/python scripts/check_coverage.py \
      coverage.json \
      --core-min 80 \
      --task-min 70
    
