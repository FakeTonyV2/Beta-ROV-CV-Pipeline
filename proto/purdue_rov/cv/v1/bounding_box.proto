syntax = "proto3";

package purdue_rov.cv.v1;

// Spec §21.1. Coordinates are normalized to [0.0, 1.0], origin
// top-left; x/y identify the upper-left corner of each box.
message BoundingBoxResult {
  string camera_id = 1;
  bytes camera_session_id = 2;
  uint64 frame_number = 3;
  int64 capture_time_unix_ns = 4;
  repeated Detection detections = 5;
}

message Detection {
  int32 class_id = 1;
  string class_name = 2;
  float confidence = 3;              // finite, within [0.0, 1.0]
  float x = 4;
  float y = 5;
  float width = 6;                   // must be positive
  float height = 7;                  // must be positive
  optional uint64 tracking_id = 8;   // absent = untracked
}