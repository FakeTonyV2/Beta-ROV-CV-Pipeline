syntax = "proto3";

package purdue_rov.cv.v1;

// Built to match BoundingBoxResult's field conventions for
// consistency (camera_session_id, int64 timestamp).
message ClassificationResult {
  string camera_id = 1;
  bytes camera_session_id = 2;
  uint64 frame_number = 3;
  int64 capture_time_unix_ns = 4;
  repeated ClassScore classes = 5;   // sorted by descending confidence
}

message ClassScore {
  int32 class_id = 1;
  string class_name = 2;
  float confidence = 3;
}