syntax = "proto3";
 
package purdue_rov.cv.v1;
 
// Spec §21.3. JPEG only, max 640x360, quality 1-95 (default 70), whole
// message including envelope capped at 4 MiB (§16.4).
message DebugSnapshot {
  string camera_id = 1;
  bytes camera_session_id = 2;
  uint64 frame_number = 3;
  int64 capture_time_unix_ns = 4;
 
  uint32 width = 5;
  uint32 height = 6;
  uint32 jpeg_quality = 7;
  bytes jpeg_data = 8;
}