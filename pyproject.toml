[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purdue-rov-cv"
version = "0.1.0"
description = "Modular Purdue ROV computer-vision data pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcap>=1.0,<2.0", "mcap-protobuf-support>=0.5.0,<1.0",
  "numpy>=1.26.0,<3.0", "psutil>=5.9.0", "protobuf>=4.25.0",
  "pydantic>=2.0,<3.0", "PyYAML>=6.0,<7.0", "pyzmq>=26.0,<28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
