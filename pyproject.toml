[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purdue-rov-cv"
version = "0.1.0"
description = "Modular Purdue ROV computer-vision data pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcap>=1.0,<2.0", "mcap-protobuf-support>=0.5.0,<1.0",
  "numpy>=1.26.0,<3.0", "psutil>=5.9.0", "protobuf>=4.25.0",
  "pydantic>=2.0,<3.0", "PyYAML>=6.0,<7.0", "pyzmq>=26.0,<28.0",
]

[project.scripts]
rov-cv = "purdue_rov_cv.cli:entrypoint"
purdue-cv-broker = "purdue_rov_cv.messaging.entrypoints:broker_entrypoint"
purdue-cv-control-router = "purdue_rov_cv.messaging.entrypoints:control_router_entrypoint"
purdue-cv-module-runner = "purdue_rov_cv.module_runner.entrypoints:module_runner_entrypoint"
purdue-cv-camera = "purdue_rov_cv.camera.entrypoints:camera_entrypoint"
purdue-cv-video-receiver = "purdue_rov_cv.video.entrypoints:video_receiver_entrypoint"
purdue-cv-recorder = "purdue_rov_cv.recording.entrypoints:recorder_entrypoint"
purdue-cv-replay = "purdue_rov_cv.replay.entrypoints:replay_entrypoint"
purdue-cv-replay-broker = "purdue_rov_cv.replay.entrypoints:replay_broker_entrypoint"
purdue-cv-video-replay = "purdue_rov_cv.replay.entrypoints:video_replay_entrypoint"

[tool.setuptools.packages.find]
where = ["src", "generated/python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "hardware: requires an explicitly configured physical device",
  "transport: real Linux transport impairment or sustained backpressure acceptance",
  "requires_net_admin: requires isolated network namespaces and CAP_NET_ADMIN/root",
  "extended: long-running or hardware acceptance coverage excluded from normal CI",
]

[tool.coverage.run]
source = ["purdue_rov_cv"]
omit = ["generated/*", "*/generated/*"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "generated/python"]
files = [
  "src/purdue_rov_cv/runtime",
  "src/purdue_rov_cv/messaging",
  "src/purdue_rov_cv/module_runner",
  "src/purdue_rov_cv/modules",
  "src/purdue_rov_cv/frame_buffer",
  "src/purdue_rov_cv/camera",
  "src/purdue_rov_cv/video",
  "src/purdue_rov_cv/recording",
  "src/purdue_rov_cv/replay",
  "src/purdue_rov_cv/preflight",
  "src/purdue_rov_cv/cli.py",
]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcap", "mcap.*", "mcap_protobuf", "mcap_protobuf.*", "psutil"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["purdue_rov.cv.v1.*"]
disable_error_code = ["var-annotated"]
